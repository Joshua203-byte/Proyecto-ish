# Docker Compose for Nodo A (Controller)
# Development environment

version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: always
    container_name: homegpu-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-homegpu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-homegpu}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-homegpu}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    container_name: homegpu-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6380:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    container_name: homegpu-api
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-homegpu}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-homegpu}
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key}
      - WORKER_SECRET=${WORKER_SECRET:-secret123}
      - NFS_MOUNT_PATH=/mnt/home-gpu-cloud
      - WOMPI_SV_APP_ID=b3532b36-7f7c-4b54-9a79-d8fa4e02f23c
      - WOMPI_SV_API_SECRET=3f7bc61b-b83f-4fc1-858f-3ce7b38682ce
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - BACKEND_URL=${BACKEND_URL:-http://localhost:8000}
    volumes:
      - ./backend:/app
      - ./data:/mnt/home-gpu-cloud
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    container_name: homegpu-celery-beat
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-homegpu}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-homegpu}
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.tasks.celery_app beat -l info

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    container_name: homegpu-worker
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgres://uedrt5h1nmumhh:p93e3c467e961339ae6f71ed7c136b0a39133d1c8da2242698dea65b58128daa9@c85cgnr0vdhse3.cluster-czrs8kj4isg7.us-east-1.rds.amazonaws.com:5432/dcmof09gpqa72v}
      - REDIS_URL=${REDIS_URL:-rediss://default:AcQNAAIncDJlMjdhMDViOGNlN2U0YjFjYWQ1ZDYyM2E2YThiOGU0NHAyNTAxODk@engaged-stork-50189.upstash.io:6379}
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key}
      - WORKER_SECRET=${WORKER_SECRET:-secret123}
      - BACKEND_URL=${BACKEND_URL:-https://www.epochly.co}
      - NFS_MOUNT_PATH=/mnt/home-gpu-cloud
    volumes:
      - ./backend:/app
      - ./data:/mnt/home-gpu-cloud
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.tasks.celery_app worker -l info -Q gpu_jobs,celery
    shm_size: '16gb'
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]

  frontend:
    build:
      context: ./frontend-react
      dockerfile: Dockerfile
    container_name: homegpu-frontend
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: always

  ngrok:
    image: ngrok/ngrok:latest
    container_name: homegpu-ngrok
    restart: unless-stopped
    command: http frontend:80
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    ports:
      - "4040:4040" # Ngrok dashboard
    depends_on:
      - frontend

volumes:
  postgres_data:
  redis_data:
